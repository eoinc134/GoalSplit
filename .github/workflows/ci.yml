name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Type-check, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts: skip lifecycle scripts from npm dependencies — CI only
      # type-checks, lints and tests, and no dependency needs an install step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # node_modules/.bin, not `npx` — turbo is already an installed
      # devDependency pinned by package-lock.json; `npx` would fall back to
      # fetching an unpinned, unreviewed version on-demand if it were ever
      # missing locally.
      - name: Build shared types
        run: node_modules/.bin/turbo build --filter=@goalsplit/types

      - name: Type-check
        run: node_modules/.bin/turbo type-check

      - name: Lint
        run: node_modules/.bin/turbo lint

      - name: Test
        run: node_modules/.bin/turbo test

  migrations:
    name: Apply migrations to an empty database
    runs-on: ubuntu-latest

    # Same major version as Railway's Postgres.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: goalsplit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/goalsplit_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Up from nothing, then a second run must find nothing pending, then
      # every reversible migration must round-trip down and up again.
      - name: Migrate up
        run: npm run migrate --workspace=apps/api

      - name: Re-run is a no-op
        run: npm run migrate --workspace=apps/api | tee migrate-again.log && grep -q "No migrations to run" migrate-again.log

      # Only when the newest migration has a Down section — irreversible
      # ones (like 0008_drop_legacy_tables) are refused by design.
      - name: Latest migration round-trips down and up
        run: |
          latest=$(ls apps/api/migrations/*.sql | sort | tail -1)
          if grep -q '^-- Down Migration$' "$latest"; then
            npm run migrate:down --workspace=apps/api
            npm run migrate --workspace=apps/api
          else
            echo "$(basename "$latest") is irreversible; skipping round-trip"
          fi
