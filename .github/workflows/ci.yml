name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Type-check, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npx turbo build --filter=@goalsplit/types

      - name: Type-check
        run: npx turbo type-check

      - name: Lint
        run: npx turbo lint

      - name: Test
        run: npx turbo test
