# Overrides for SonarCloud Automatic Analysis (no CI-based scanner step in this
# repo — see https://docs.sonarcloud.io/advanced-setup/automatic-analysis/).

# Exclude test files from duplication (CPD) detection. Test arrange/mock setup
# is often near-identical across cases on purpose — each test stays readable
# and independently verifiable rather than sharing state through abstraction —
# so this isn't copy-paste debt in the way CPD assumes for application code.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx
