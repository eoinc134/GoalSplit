services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: goalsplit
      POSTGRES_USER: goalsplit
      POSTGRES_PASSWORD: goalsplit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalsplit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
