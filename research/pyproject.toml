# Tool configuration for research/ (not a packaged project — install with
# `pip install -r requirements-dev.txt`). See README.md → "Development".

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes: undefined names, unused imports, …
  "I",        # import order
  "B",        # bugbear: likely bugs
  "UP",       # pyupgrade
  "SIM",      # simplifications
  "NPY",      # NumPy-specific
  "RUF",      # ruff-specific
]
ignore = [
  "E501",  # line length: the formatter handles code; long strings and comments are fine
  "E741",  # `l`, `I`: single-letter names are normal in the maths here
  "B905",  # zip(strict=): adding it changes behaviour on unequal lengths; not a blanket change
  "RUF001", "RUF002", "RUF003",  # en dashes, minus signs, primes: deliberate typography in the prose
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are generated by notebooks/build_*.py, so only real errors are
# reported for them (undefined names, unused imports, likely bugs) — style
# lives in the builders' code strings, which are reviewed as code. Fixes go
# in the builder, never in the .ipynb (check_notebooks.py enforces that).
"*.ipynb" = ["E", "W", "I", "UP", "SIM", "RUF"]
# False positive: `fmt` (a lambda over the loop's `event`) is called within
# the same iteration that defines it. Rewriting it would change the committed,
# executed study notebook for no behavioural difference.
"notebooks/03-before-after.ipynb" = ["E", "W", "I", "UP", "SIM", "RUF", "B023"]

[tool.ruff.format]
# Formatting a generated notebook would make it drift from its builder.
exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:goalsplit_research.*"]
