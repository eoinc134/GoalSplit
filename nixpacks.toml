# Adds Python + garmy on top of Railway's auto-detected Node build for the API
# service, so the deployed container can run garmy the same way the local dev
# API does (apps/api/src/services/garmin-sync.service.ts).
#
# Deliberately additive: a new phase depending on Nixpacks' built-in `setup`,
# rather than redefining `phases.setup` itself — avoids touching whatever
# Node setup Nixpacks auto-detects, so the existing Build/Start Command
# settings in the Railway dashboard keep working unchanged.
#
# Confirmed on a real deploy: the pip-installed `garmy-sync` console script's
# own bin directory is NOT reliably on PATH at runtime (hit `spawn garmy-sync
# ENOENT` in production even though `pip install garmy[localdb]` here had
# succeeded) — so the API invokes garmy via `python3 -m garmy.localdb.cli`
# instead of the `garmy-sync` binary. That only needs `python3` itself on
# PATH, which Nixpacks' `python311` package provides reliably, unlike a pip
# console script's bin dir.
[phases.python]
dependsOn = ["setup"]
nixPkgs = ["python311", "python311Packages.pip"]
cmds = ["pip install garmy[localdb]"]
